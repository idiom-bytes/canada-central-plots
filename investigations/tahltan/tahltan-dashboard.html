<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tahltan Territory — Treaty &amp; Resource-Land Investigation</title>
<style>
  :root{
    --bg:#0d1117; --surface:#161b22; --surface2:#1c2128; --border:#30363d;
    --text:#e6edf3; --muted:#8b949e; --link:#58a6ff;
    --gov:#f0883e; --fn:#2dd4bf; --company:#58a6ff; --individual:#3fb950; --ngo:#bc8cff;
    --edge-agreement:#f0883e; --edge-ownership:#58a6ff; --edge-funding:#f85149;
    --edge-advisory:#8b949e; --edge-revolving:#f85149; --edge-litigation:#bc8cff; --edge-lobbying:#39c5cf;
    --red:#f85149; --orange:#f0883e; --blue:#58a6ff; --teal:#2dd4bf;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;height:100%;background:var(--bg);color:var(--text);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif;}
  body{display:flex;flex-direction:column;height:100vh;overflow:hidden;}
  header{padding:10px 18px;border-bottom:1px solid var(--border);background:var(--surface);
    display:flex;align-items:baseline;gap:14px;flex-shrink:0;flex-wrap:wrap;}
  header h1{font-size:16px;margin:0;font-weight:600;}
  header .sub{font-size:12px;color:var(--muted);}
  header .badge{margin-left:auto;font-size:11px;padding:3px 8px;border:1px solid var(--border);
    border-radius:12px;color:var(--muted);}
  main{flex:1;display:flex;min-height:0;}
  #graphPanel{width:60%;position:relative;border-right:1px solid var(--border);background:
    radial-gradient(circle at 30% 20%, #121821 0%, #0d1117 70%);overflow:hidden;}
  #graphSvg{width:100%;height:100%;display:block;cursor:grab;}
  .toolbar{position:absolute;top:10px;left:10px;right:10px;display:flex;gap:6px;flex-wrap:wrap;
    z-index:5;pointer-events:none;}
  .toolbar .filters{display:flex;gap:5px;flex-wrap:wrap;pointer-events:auto;}
  .filter-btn{background:var(--surface);border:1px solid var(--border);color:var(--text);
    font-size:11px;padding:5px 9px;border-radius:5px;cursor:pointer;display:flex;align-items:center;gap:5px;
    transition:background .15s;}
  .filter-btn:hover{background:var(--surface2);}
  .filter-btn.active{border-color:currentColor;}
  .filter-btn .dot{width:8px;height:8px;border-radius:2px;flex-shrink:0;}
  .legend{position:absolute;bottom:10px;left:10px;background:rgba(22,27,34,.92);border:1px solid var(--border);
    border-radius:8px;padding:10px 12px;font-size:11px;z-index:5;max-width:230px;backdrop-filter:blur(2px);}
  .legend h4{margin:0 0 6px;font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.04em;}
  .legend .row{display:flex;align-items:center;gap:7px;margin:3px 0;}
  .legend .swatch{width:11px;height:11px;border-radius:50%;flex-shrink:0;}
  .legend .line{width:18px;height:0;border-top-width:2px;flex-shrink:0;}
  .legend hr{border:none;border-top:1px solid var(--border);margin:7px 0;}
  #tooltip{position:fixed;pointer-events:none;background:#010409;border:1px solid var(--border);
    border-radius:6px;padding:8px 10px;font-size:11.5px;max-width:280px;z-index:50;display:none;
    box-shadow:0 4px 16px rgba(0,0,0,.5);line-height:1.4;}
  #tooltip .t-title{font-weight:600;margin-bottom:3px;}
  #tooltip .t-cat{color:var(--muted);font-size:10px;text-transform:uppercase;letter-spacing:.03em;margin-bottom:4px;}
  #detailDrawer{position:absolute;right:0;bottom:0;left:0;max-height:46%;background:rgba(13,17,23,.98);
    border-top:1px solid var(--border);transform:translateY(100%);transition:transform .2s ease;
    z-index:20;overflow-y:auto;padding:14px 18px 18px;}
  #detailDrawer.open{transform:translateY(0);}
  #detailDrawer .dd-head{display:flex;align-items:flex-start;gap:10px;margin-bottom:8px;}
  #detailDrawer .dd-title{font-size:14px;font-weight:600;flex:1;}
  #detailDrawer .dd-close{background:none;border:1px solid var(--border);color:var(--muted);
    border-radius:5px;width:24px;height:24px;cursor:pointer;font-size:13px;line-height:1;}
  #detailDrawer .dd-cat{display:inline-block;font-size:10px;padding:2px 7px;border-radius:10px;
    text-transform:uppercase;letter-spacing:.03em;margin-bottom:8px;}
  #detailDrawer .dd-body{font-size:12.5px;line-height:1.6;color:#c9d1d9;}
  #detailDrawer .dd-sources{margin-top:10px;font-size:11.5px;}
  #detailDrawer .dd-sources a{color:var(--link);display:block;margin:2px 0;word-break:break-all;}
  #detailDrawer .dd-conns{margin-top:10px;}
  #detailDrawer .conn-item{border:1px solid var(--border);border-radius:6px;padding:6px 8px;margin:5px 0;
    font-size:11.5px;cursor:pointer;background:var(--surface);}
  #detailDrawer .conn-item:hover{background:var(--surface2);}
  #detailDrawer .conn-item .cl{color:var(--muted);font-size:10.5px;}
  .warn-icon{color:var(--red);font-size:13px;}

  #sidePanel{width:40%;display:flex;flex-direction:column;min-height:0;}
  .tabs{display:flex;border-bottom:1px solid var(--border);background:var(--surface);flex-shrink:0;}
  .tab-btn{flex:1;padding:11px 6px;background:none;border:none;color:var(--muted);cursor:pointer;
    font-size:12.5px;font-weight:600;border-bottom:2px solid transparent;letter-spacing:.02em;}
  .tab-btn.active{color:var(--text);border-bottom-color:var(--blue);}
  .tab-content{flex:1;overflow-y:auto;padding:14px 16px 40px;display:none;}
  .tab-content.active{display:block;}

  .card{background:var(--surface);border:1px solid var(--border);border-radius:8px;padding:12px 14px;
    margin-bottom:12px;border-left:3px solid var(--border);}
  .card.sev-critical{border-left-color:var(--red);}
  .card.sev-warning{border-left-color:var(--orange);}
  .card.sev-info{border-left-color:var(--blue);}
  .card.sev-advocacy{border-left-color:var(--ngo);}
  .card.hero{border:1px solid var(--teal);border-left:4px solid var(--teal);background:#0f1e1c;}
  .card h3{margin:0 0 6px;font-size:13.5px;}
  .card .sev-label{font-size:10px;text-transform:uppercase;letter-spacing:.04em;color:var(--muted);margin-bottom:6px;}
  .card p{margin:6px 0;font-size:12.5px;line-height:1.55;color:#c9d1d9;}
  .card .src{margin-top:8px;font-size:11px;}
  .card .src a{color:var(--link);margin-right:10px;}
  .section-label{font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);
    margin:18px 0 8px;font-weight:700;}
  .section-label:first-child{margin-top:0;}

  .tl-item{display:flex;gap:10px;margin-bottom:14px;position:relative;}
  .tl-dot{width:10px;height:10px;border-radius:50%;margin-top:4px;flex-shrink:0;box-shadow:0 0 0 3px var(--bg);}
  .tl-item:not(:last-child)::before{content:'';position:absolute;left:4px;top:16px;bottom:-14px;width:1px;
    background:var(--border);}
  .tl-date{font-size:11px;color:var(--muted);font-weight:600;}
  .tl-label{font-size:12.5px;font-weight:600;margin:2px 0;}
  .tl-desc{font-size:12px;color:#c9d1d9;line-height:1.5;}

  .src-cat{margin-bottom:16px;}
  .src-cat h4{font-size:12px;text-transform:uppercase;letter-spacing:.04em;color:var(--muted);
    margin:0 0 6px;border-bottom:1px solid var(--border);padding-bottom:4px;}
  .src-cat a{display:block;font-size:11.5px;color:var(--link);margin:4px 0;word-break:break-all;
    line-height:1.4;}
  .src-cat a span{color:var(--muted);}
  .gaps-list{list-style:none;padding:0;margin:0;}
  .gaps-list li{font-size:12px;color:#c9d1d9;background:var(--surface);border:1px solid var(--border);
    border-radius:6px;padding:8px 10px;margin-bottom:7px;line-height:1.5;}

  ::-webkit-scrollbar{width:9px;height:9px;}
  ::-webkit-scrollbar-thumb{background:#30363d;border-radius:5px;}
  ::-webkit-scrollbar-track{background:transparent;}

  svg text{user-select:none;-webkit-user-select:none;}
  .node-circle{stroke:#010409;stroke-width:1.5;cursor:pointer;}
  .node-warn-ring{fill:none;stroke:var(--red);stroke-width:1.6;stroke-dasharray:3,3;}
  .node-label{font-size:9.5px;fill:#c9d1d9;pointer-events:none;}
  .edge-line{fill:none;}
  .edge-hit{fill:none;stroke:transparent;stroke-width:12;cursor:pointer;}
</style>
</head>
<body>

<header>
  <h1>Tahltan Territory — Treaty &amp; Resource-Land Investigation</h1>
  <span class="sub">Nodes: relationships between Crown governments, Tahltan Nation entities, resource companies, officials and advocacy organizations</span>
  <span class="badge">Investigation date: Aug 12, 2026</span>
</header>

<main>
  <div id="graphPanel">
    <svg id="graphSvg"></svg>
    <div class="toolbar">
      <div class="filters" id="filterBar"></div>
    </div>
    <div class="legend" id="legendBox"></div>
    <div id="detailDrawer">
      <div class="dd-head">
        <div style="flex:1">
          <span class="dd-cat" id="ddCat"></span>
          <div class="dd-title" id="ddTitle"></div>
        </div>
        <button class="dd-close" id="ddClose">×</button>
      </div>
      <div class="dd-body" id="ddBody"></div>
      <div class="dd-sources" id="ddSources"></div>
      <div class="dd-conns" id="ddConns"></div>
    </div>

  <div id="sidePanel">
    <div class="tabs">
      <button class="tab-btn active" data-tab="risks">Risks</button>
      <button class="tab-btn" data-tab="timeline">Timeline</button>
      <button class="tab-btn" data-tab="sources">Sources</button>

<div id="tooltip"></div>

<script>
/* ============================== DATA ============================== */

const CATS = {
  gov:        {label:'Government / Crown',   color:'#f0883e'},
  fn:         {label:'First Nation entity',  color:'#2dd4bf'},
  company:    {label:'Resource company',     color:'#58a6ff'},
  individual: {label:'Individual',           color:'#3fb950'},
  ngo:        {label:'NGO / advocacy',       color:'#bc8cff'}
};

const EDGE_TYPES = {
  agreement:          {label:'Agreement / consent',      color:'#f0883e', dash:'7,4',  width:2},
  'agreement-unsigned':{label:'Agreement (unsigned)',     color:'#f0883e', dash:'2,6',  width:1.5, opacity:.55},
  ownership:          {label:'Ownership / tenure',        color:'#58a6ff', dash:'',     width:2},
  funding:            {label:'Funding / donation',        color:'#f85149', dash:'',     width:2},
  advisory:           {label:'Advisory / legal (role)',   color:'#8b949e', dash:'1,4',  width:1.5},
  revolving:          {label:'Revolving door',             color:'#f85149', dash:'',     width:2.6},
  litigation:         {label:'Litigation',                 color:'#bc8cff', dash:'7,4',  width:2},
  lobbying:           {label:'Lobbying contact',           color:'#39c5cf', dash:'5,3',  width:2}
};

const NODES = [
// -------- Government / Crown --------
{id:'gov-bc', label:'Province of British Columbia', cat:'gov',
 detail:`The Crown government party to every Tahltan agreement in this file: the 2020 Shared Prosperity Agreement, the Nov 2023 Red Chris consent-based decision agreement, the unsigned Foundation Agreement, and the Eskay Creek and Red Chris permit approvals. Represented across these dated instruments by Premier John Horgan (2020 SPA) and Premier David Eby (current); successive Ministers of Indigenous Relations and Reconciliation (Murray Rankin, then Spencer Chandra Herbert); Ministers of Mining and Critical Minerals / Energy and Mines (Bill Bennett, Bruce Ralston, Jagrup Brar); Ministers of Environment (George Heyman, then Tamara Davidson). Tahltan is NOT part of the BC Treaty Commission process — it does not appear in BC Public Accounts 2025/26 Note 28's treaty-land table.`,
 sources:[{l:'BC Gov News — 2021EMLI0041 (SPA)',u:'https://news.gov.bc.ca/releases/2021EMLI0041-001128'},{l:'BC gov First Nations A-Z listing',u:'https://www2.gov.bc.ca/gov/content/environment/natural-resource-stewardship/consulting-with-first-nations/first-nations-negotiations/first-nations-a-z-listing/tahltan-central-government'}]},
{id:'gov-canada', label:'Government of Canada', cat:'gov',
 detail:`Federal Crown party with a smaller, less-documented direct role in Tahltan-specific matters than the Province. Documented involvement: the 2010 Supreme Court of Canada MiningWatch v. Canada ruling on federal environmental-assessment scoping for Red Chris; Red Chris expansion listed on Canada's Major Projects Office national projects list; up to $44.2M (conditional) approved toward electricity transmission capacity supporting Red Chris and KSM (2024 NRCan announcement — REPORTED, original release not independently re-fetched). A July 2, 2026 federal-provincial "cooperative prosperity agreement" was referenced once in a search summary but NOT independently verified — flagged as a gap, not stated as fact here.`,
 sources:[{l:'CanLII — 2010 SCC 2',u:'https://www.canlii.org/en/ca/scc/doc/2010/2010scc2/2010scc2.html'},{l:'Canada.ca — Major Projects Office, Red Chris',u:'https://www.canada.ca/en/privy-council/major-projects-office/projects/national/red-chris.html'}]},
{id:'bcgs', label:'BC Geological Survey', cat:'gov',
 detail:`A branch within the Province's Ministry of Mining and Critical Minerals lineage — an organizational sub-entity of the Province, not a separate government. Publisher of Information Circular 2022-05, "The Golden Triangle of northwestern British Columbia" (8 pages), the primary source of the viral "$1.28 trillion" figure. That figure ($1,280 billion CAD, ≈US$985B at the report's own exchange rate) is an in-situ contained-metal value for the Golden Triangle mining district as a whole — not a Tahltan-specific figure, not a land value, not money changing hands, and includes low-confidence Inferred resources. The circular's full text contains ZERO mentions of "Tahltan," "First Nation," or "Indigenous." Underlying tonnage/grade data credited to DigiGeoData, a private third-party aggregator, not independently generated by BCGS.`,
 sources:[{l:'BCGS Information Circular 2022-05 (PDF)',u:'https://cmscontent.nrs.gov.bc.ca/geoscience/PublicationCatalogue/InformationCircular/BCGS_IC2022-05.pdf'},{l:'DigiGeoData (underlying dataset)',u:'https://digigeodata.com/area/golden-triangle/'}]},

// -------- First Nation entities --------
{id:'tcg', label:'Tahltan Central Government (TCG)', cat:'fn',
 detail:`The central administrative governing body of the Tahltan Nation (≈5,000 members, on- and off-reserve) — the entity that negotiates and signs the Shared Prosperity Agreement, the Foundation Agreement, and every project-specific consent/benefit agreement in this file. Presidents: Chad Norman Day (Jul 2014–Mar 2024, suspended Nov 2023, dismissed Mar 2024) then Kerry Carlick (since a Jun/Jul 2024 election). Not part of the BC Treaty Commission process; pursues negotiated recognition agreements, not litigation, per every source reviewed.`,
 sources:[{l:'Tahltan Central Government (official)',u:'https://tahltan.org/central-government/'}]},
{id:'tahltan-band', label:'Tahltan Band Council', cat:'fn',
 detail:`One of two Indian Act band governments within the Tahltan Nation; co-signatory (with TCG and Iskut Band Council) on the March 2020 Shared Prosperity Agreement. Chief at time of signing: Carmen McPhee. BC government maintains a separate "First Nations A-Z" negotiation listing for Tahltan Band Council, distinct from TCG.`,
 sources:[{l:'BC gov First Nations A-Z listing',u:'https://www2.gov.bc.ca/gov/content/environment/natural-resource-stewardship/consulting-with-first-nations/first-nations-negotiations/first-nations-a-z-listing/tahltan-band-council'}]},
{id:'iskut-band', label:'Iskut Band Council', cat:'fn',
 detail:`The second of two Indian Act band governments within the Tahltan Nation; co-signatory on the March 2020 Shared Prosperity Agreement. Chief at time of signing: Marie Quock.`,
 sources:[{l:'BC Gov News — 2021EMLI0041',u:'https://news.gov.bc.ca/releases/2021EMLI0041-001128'}]},

// -------- Resource companies --------
{id:'newmont', label:'Newmont Corporation', cat:'company',
 detail:`Delaware-incorporated, Denver-HQ, dual-listed NYSE:NEM / TSX:NGT. Operator and 70% owner of Red Chris (acquired via its Nov 2023 acquisition of Newcrest Mining, the Australian company that bought Imperial Metals' 70% stake in Aug 2019). Also 50% JV partner (with Teck) in Galore Creek, and sole operator of Brucejack — which sits in territory asserted by both Tsetsaut Skii km Lax Ha and Tahltan Nations, NOT exclusively Tahltan. Largest reported institutional shareholders: Vanguard Group (≈7.7–12%, sources disagree) and BlackRock (≈6.2–11%, sources disagree) — ordinary diversified institutional holdings, not individual control. Newmont's US domicile (and Newcrest's former Australian domicile) is reported here as ordinary foreign direct investment; no source found alleges state-linked interference tied to Newmont in Tahltan territory.`,
 sources:[{l:'Newmont — Red Chris operations page',u:'https://operations.newmont.com/canada/red-chris-canada/'},{l:'Newmont — Brucejack CEAA annual report',u:'https://operations.newmont.com/_doc/operation/bluejack/annual-reports/Brucejack%20Mine%202024%20CEAA%20Annual%20Report.pdf'},{l:'StockTitan — Newmont 13G filing summary',u:'https://www.stocktitan.net/sec-filings/NEM/schedule-13g-newmont-corp-de-passive-investment-disclosure-5-cdc12a64aaaf.html'}]},
{id:'imperial', label:'Imperial Metals Corporation', cat:'company',
 detail:`30% owner of Red Chris (sold the 70% majority stake in 2019, now held via Newmont). Chairman and largest shareholder (≈40%) is N. Murray Edwards. Imperial Metals also operated the Mount Polley mine (Secwepemc/Xatsull territory, central BC — NOT Tahltan territory) where a 2014 tailings dam failure occurred; included only as company-level risk context, not a Tahltan-territory incident. Referenced as contextual case study in BC's May 2016 Auditor General mining-compliance report.`,
 sources:[{l:'Imperial Metals — Red Chris page',u:'https://imperialmetals.com/our-operations/red-chris-mine'},{l:'Global News — Red Chris history',u:'https://globalnews.ca/news/11303093/red-chris-mine-history/'}]},
{id:'teck', label:'Teck Resources Limited', cat:'company',
 detail:`Vancouver-HQ, TSX/NYSE-listed. 75% operator of Schaft Creek (JV with Copper Fox Metals, 25%) and 50% JV partner (with Newmont) in Galore Creek. Controlled via Class A high-vote shares by the Keevil family through Temagami Mining Ltd. Was the largest single corporate donor to the BC Liberal Party 2005–2015 ($2.8M+); pre-dates BC's Nov 2017 corporate-donation ban. No source ties this donation history to any specific Tahltan-territory decision.`,
 sources:[{l:'Teck — Galore Creek project page',u:'https://www.teck.com/operations/canada/projects/galore-creek-project/'},{l:'Teck — Schaft Creek solar release (2025)',u:'https://www.teck.com/news/stories/2025/schaft-creek-solar-facility'}]},
{id:'copperfox', label:'Copper Fox Metals Inc.', cat:'company',
 detail:`Calgary-HQ, TSX Venture-listed (CUU.V). Holds 25% of the Schaft Creek Joint Venture (Teck 75%, operator), formed Jul 15, 2013. Largest reported shareholder: Ernesto Echavarria (≈57%, REPORTED via aggregator sites, not cross-checked against a SEDI filing) — no indication of billionaire-scale wealth; net worth/citizenship UNVERIFIED, flagged as a research gap.`,
 sources:[{l:'Copper Fox — Schaft Creek overview',u:'https://copperfoxmetals.com/projects/schaft-creek-project/overview/'}]},
{id:'skeena', label:'Skeena Gold & Silver (Skeena Resources)', cat:'company',
 detail:`Vancouver-HQ, TSX/NYSE-listed as SKE. 100% owner of the Eskay Creek Gold-Silver Project. Tahltan Nation voted in Dec 2025 to support an Impact Benefit Agreement (employment, business opportunities, training, elders' facility, financial participation). EA Certificate + federal Impact Assessment Act approval issued Jan 26–28, 2026. Institutional shareholders include BlackRock (≈1.6%, REPORTED) and UBS; a specific Anglo American strategic stake was searched for and NOT confirmed — flagged as a research gap, not stated as fact.`,
 sources:[{l:'Skeena — Tahltan vote release',u:'https://skeenagoldsilver.com/news-release/skeena-announces-successful-tahltan-nation-vote-supporting-the-eskay-creek-impact-benefit-agreement/'},{l:'GlobeNewswire — EA Certificate',u:'https://www.globenewswire.com/news-release/2026/01/27/3226273/0/en/Skeena-Gold-Silver-Secures-Environmental-Assessment-Certificate-and-Federal-Impact-Assessment-Approval-for-Eskay-Creek.html'}]},
{id:'seabridge', label:'Seabridge Gold Inc.', cat:'company',
 detail:`Toronto-HQ, TSX:SEA / NYSE:SA. 100% owner of the KSM (Kerr-Sulphurets-Mitchell) project. Tahltan Nation voted 77.8% in favour of a KSM Impact Benefits/Co-operation Agreement. Also holds a benefits agreement with the Nisga'a Nation; company reports ≈CA$400M directed to Indigenous-affiliated business contracts (company-reported, not independently audited). Named a BC "priority project" (Apr 2026). Subject of a June 2026 BC Supreme Court ruling (2026 BCSC 1042, Burke J.) finding the Province breached its duty to consult a DIFFERENT Nation — the Tsetsaut Skii km Lax Ha — before granting KSM's Substantial Start Determination; NOT a Tahltan party case. Institutional ownership ≈38–44% (sources vary); largest reported institutional holder Kopernik Global Investors (≈7.99%, US-based).`,
 sources:[{l:'Newsfile — KSM IBA release',u:'https://www.newsfilecorp.com/release/45434/Tahltan-Nation-and-Seabridge-Gold-Execute-FarReaching-Agreement-Covering-Protections-of-Indigenous-Rights-and-the-Environment-and-Shared-Economic-Benefits-for-KSM-Project'},{l:'CBC — TSKLH ruling',u:'https://www.cbc.ca/news/canada/british-columbia/province-consult-duty-gold-mine-9.7229420'}]},
{id:'kutcho', label:'Kutcho Copper Corp.', cat:'company',
 detail:`Junior copper-zinc explorer. Its Kutcho project sits ≈100 km east of Dease Lake, WITHIN Tahltan Territory; the company signed exploration/communication agreements with TCG in 2018. Bill Bennett — the former BC Minister of Energy and Mines who personally signed the province's 2017 bilateral Red Chris agreement — joined Kutcho Copper's board of directors after leaving office: the single documented revolving-door finding in this investigation.`,
 sources:[{l:'Kutcho Copper — 2018 TCG agreement release',u:'https://kutcho.ca/news/2018/kutcho-copper-signs-exploration-and-communication-agreements-with-tahltan-central-government/'},{l:'Mining-technology.com — Kutcho project',u:'https://www.mining-technology.com/projects/kutcho-copper-and-zinc-project-british-columbia-canada/'}]},

// -------- Individuals --------
{id:'edwards', label:'N. Murray Edwards', cat:'individual',
 detail:`Canadian billionaire (Forbes 2026: ≈#908 globally, net worth ≈US$4.8B). Chairman of the Board and largest shareholder (≈40% of shares outstanding) of Imperial Metals Corporation, the 30% owner-operator partner at Red Chris; has personally injected capital, provided loans, and guaranteed credit lines to Imperial Metals. Fortune derives primarily from Canadian Natural Resources Ltd. (oil sands) and Ensign Energy — Imperial Metals/Red Chris is one holding among several. Also co-owns the Calgary Flames (NHL). No documented government role or donation tie in this file — reported here purely as a financial-interest-concentration finding.`,
 sources:[{l:'Forbes profile',u:'https://www.forbes.com/profile/n-murray-edwards/'}]},
{id:'keevil', label:'Keevil Family (Temagami Mining)', cat:'individual',
 detail:`Controls Teck Resources via Temagami Mining Ltd's ownership of 55% of Teck's high-vote Class A shares (100 votes/share vs 1 vote/share for Class B) — a controlling, not majority-economic, interest (economic stake reported under 1%). Teck holds 75% of Schaft Creek and 50% of Galore Creek, both in Tahltan territory. Class A shares fully sunset to single-vote Class B by May 12, 2029. Norm Keevil personally donated $65,585 to the BC Liberal Party since 2010 — general provincial political-finance history; no source ties this to any specific Tahltan-territory decision.`,
 sources:[{l:'Teck — sunset dual-class announcement',u:'https://www.teck.com/news/news-releases/2023/teck-introduces-sunset-for-dual-class-share-structure'},{l:'The Narwhal — Teck largest BC Liberal donor',u:'https://thenarwhal.ca/how-teck-resources-benefits-being-b-c-liberal-s-largest-donor/'}]},
{id:'bennett', label:'Bill Bennett', cat:'individual', warning:true,
 detail:`Former BC Minister of Energy and Mines (BC Liberal government). Personally signed the province's foundational 2017 bilateral Tahltan-BC agreement on Red Chris Mine (with TCG President Chad Day). DOCUMENTED REVOLVING-DOOR FINDING: joined the board of Eagle Plains Resources (TSXV:EPL) just three days after leaving cabinet/his MLA seat, and has since also served as a director of Kutcho Copper Corp. — whose Kutcho project sits inside Tahltan Territory and has its own 2018 TCG exploration agreement — plus a director of Ascot Resources Ltd. (Nisga'a Treaty lands, adjacent to but not within core Tahltan territory) and a consultant to Rare Earth Ridge Resources Corp. (same NW-BC mineral belt). As minister at the time of the Auditor General's May 2016 mining-compliance report (which used Red Chris/Imperial Metals as context), he did not resign despite calls to do so. IMPORTANT: no evidence was found of any donation, payment, or arrangement predating his exit from office — this is a documented revolving-door PATTERN, not an in-office financial conflict. Reported factually; not an assertion of wrongdoing.`,
 sources:[{l:'Mining.com — Bennett joins board',u:'https://www.mining.com/former-bc-mines-minister-now-director-project-generating-junior'},{l:'Eagle Plains — appointment release',u:'https://www.eagleplains.com/news/eagle-plains-announces-appointment-bill-bennett-board-directors-resignation-ron-netolitzky'},{l:'Georgia Straight — Bennett won’t resign',u:'https://www.straight.com/news/691076/bc-energy-and-mines-minister-bill-bennett-wont-resign-wake-damning-auditor-generals'},{l:'LinkedIn — Bill Bennett',u:'https://www.linkedin.com/in/kootenaybillbennett/'}]},
{id:'rankin', label:'Murray Rankin', cat:'individual',
 detail:`BC Minister of Indigenous Relations and Reconciliation, Nov 26, 2020–Nov 18, 2024. Co-signed the Nov 1, 2023 Red Chris consent-based decision-making agreement (with George Heyman and TCG President Chad Day) under DRIPA s.7. Named in the June 2021 Shared Prosperity Agreement announcement. Revolving-door check: NONE FOUND — founding partner of Victoria environmental/administrative law firm Arvay Finlay LLP before politics, returned there after leaving the legislature; no mining-company board, consulting, or executive role identified.`,
 sources:[{l:'BC Gov News — 2023ENV0061',u:'https://news.gov.bc.ca/releases/2023ENV0061-001707'},{l:'Arvay Finlay — Rankin bio',u:'https://arvayfinlay.ca/murray-rankin/'}]},
{id:'chandra-herbert', label:'Spencer Chandra Herbert', cat:'individual',
 detail:`BC Minister of Indigenous Relations and Reconciliation since Jul 17, 2025 (current). Named in the June 19, 2026 provincial approval of the Red Chris mine expansion. No revolving-door or prior-employment tie to any named company found in this research pass.`,
 sources:[{l:'BC Gov News — 2026MCM0029',u:'https://news.gov.bc.ca/releases/2026MCM0029-000727'}]},
{id:'brar', label:'Jagrup Brar', cat:'individual',
 detail:`BC Minister of Mining and Critical Minerals since Nov 18, 2024 (current). Co-approved the Eskay Creek EA certificate (with Tamara Davidson) and co-named in the June 19, 2026 Red Chris expansion Mines Act approval. Pre-politics career: Surrey non-profit/public sector (SEEDS, PICS Society) — no mining background identified. Revolving-door check: none found.`,
 sources:[{l:'BC Gov News — 2026MCM0008',u:'https://news.gov.bc.ca/releases/2026MCM0008-000078'},{l:'Canadianwhoswho — Brar bio',u:'https://canadianwhoswho.ca/bio.php?id=28559'}]},
{id:'davidson', label:'Tamara Davidson', cat:'individual',
 detail:`BC Minister of Environment and Parks since Nov 2024 (current). Approved the June 18, 2026 Red Chris EA-certificate amendment (open-pit to underground block-cave transition, 27 legally binding conditions, 12 co-developed with TCG) and co-decided the Eskay Creek certificate. Pre-politics career: 25+ years federal public service (land management, Indigenous relations) and Haida Nation governance — no mining-sector employer identified. Revolving-door check: none found.`,
 sources:[{l:'BC Gov News — 2026ENV0031',u:'https://news.gov.bc.ca/releases/2026ENV0031-000725'},{l:'ORCBC — Davidson bio',u:'https://www.orcbc.ca/blog/new-leader-of-environment-and-parks-sees-a-lot-of-potential-for-recreation-over-the-next-4-years'}]},
{id:'heyman', label:'George Heyman', cat:'individual',
 detail:`BC Minister of Environment and Climate Change Strategy (through 2024). Co-signed the Nov 1, 2023 Red Chris consent-based decision-making agreement. No prior mining-industry employment or post-office mining-company role found in this research pass — reported as an absence-of-evidence gap, not a confirmed clean record.`,
 sources:[{l:'BC Gov News — 2023ENV0061',u:'https://news.gov.bc.ca/releases/2023ENV0061-001707'}]},
{id:'cullen', label:'Nathan Cullen', cat:'individual',
 detail:`BC NDP MLA for Stikine, 2020–2024 (lost seat to Sharon Hartwell in 2024); held Minister of State for Lands and Natural Resource Operations, Municipal Affairs, and Water, Land and Resource Stewardship portfolios. Witnessed the Nov 1, 2023 Tahltan-BC consent-based decision agreement as constituency MLA; named in the June 2021 Shared Prosperity Agreement release. No post-2024 board/consulting/mining-company role identified in this search — flagged as a research gap, not a confirmed clean record.`,
 sources:[{l:'BC Gov News — 2021EMLI0041',u:'https://news.gov.bc.ca/releases/2021EMLI0041-001128'}]},
{id:'hartwell', label:'Sharon Hartwell', cat:'individual',
 detail:`BC Conservative MLA for Bulkley Valley-Stikine (the riding covering Dease Lake, Telegraph Creek and Iskut — the core Tahltan communities), elected 2024 (current); former 12-year mayor of Telkwa. No specific documented role in a Tahltan land/resource agreement found in this search. No mining-industry employment found before or after politics.`,
 sources:[{l:'Wikipedia — Bulkley Valley-Stikine',u:'https://en.wikipedia.org/wiki/Bulkley_Valley-Stikine'}]},
{id:'day', label:'Chad Norman Day', cat:'individual',
 detail:`TCG President, Jul 2014–Mar 2024. Signed the 2017 Red Chris bilateral agreement (with Bill Bennett) and the Nov 1, 2023 consent-based decision-making agreement. Suspended by the TCG board of directors in November 2023 — the same month he signed the Red Chris consent agreement — and formally dismissed March 2024. Sued TCG for wrongful/constructive dismissal (2025 BCSC 1363); court awarded him $320K+ but found no bad faith by the board. Internal governance matter, not a land-rights case; no source draws a causal link between the suspension timing and the agreement he signed the same month.`,
 sources:[{l:'Prince George Citizen — Day v. TCG ruling',u:'https://www.princegeorgecitizen.com/local-news/judge-awards-ex-tahltan-president-more-than-320k-for-wrongful-dismissal-10965191'},{l:'HR Reporter — case summary',u:'https://www.hrreporter.com/chrr-plus/employment-law-cases/11275'}]},
{id:'carlick', label:'Kerry Carlick', cat:'individual',
 detail:`TCG President since a Jul 6, 2024 general election (won a Jun 2024 by-election first). Quoted in the June 19, 2026 Red Chris expansion approval release, formally consenting to the expansion on TCG's behalf.`,
 sources:[{l:'BC Gov News — 2026MCM0029',u:'https://news.gov.bc.ca/releases/2026MCM0029-000727'}]},
{id:'stone', label:'Todd Stone', cat:'individual',
 detail:`AME President & CEO since Aug 5, 2025. Former BC Liberal/BC United MLA for Kamloops–South Thompson (2013–2024); Minister of Transportation and Infrastructure 2013–2017 (NOT Energy/Mines — no direct Tahltan-specific agreement tie found). Ran fourth in the 2018 BC Liberal leadership race; did not seek re-election in 2024. This is structurally the SAME minister-to-mining-sector-leadership pattern already documented for Bill Bennett, but WEAKER: Stone's portfolio was Transportation, not Energy/Mines, and no source ties him to any Tahltan-specific decision, agreement, or lobbying activity. Reported as a governance-pattern observation, not an equivalent finding to Bennett's documented revolving door.`,
 sources:[{l:'AME — Stone appointment release',u:'https://amebc.ca/news/association-for-mineral-exploration-welcomes-todd-stone-as-new-president-ceo/'},{l:'Wikipedia — Todd Stone',u:'https://en.wikipedia.org/wiki/Todd_Stone'}]},
{id:'rigaux', label:'Jonas Rigaux', cat:'individual',
 detail:`Mineral-exploration consultant/prospector with resource-industry experience across BC, Iraq, Suriname, and the Arctic. Appointed to the Association for Mineral Exploration BC (AME) board of directors in 2026, and simultaneously a director of the Public Land Use Society (PLUS). THE KEY CONNECTOR in this investigation's NGO-network research: the clearest documented personnel overlap between AME (a registered Tahltan-specific industry lobbyist) and PLUS (source of the Foundation Agreement FOI reporting). This does not, by itself, mean PLUS's FOI reporting is inaccurate — the withheld/obtained records are independently verifiable facts regardless of board composition — but it is a material fact for assessing PLUS's institutional independence from the mineral-exploration industry.`,
 sources:[{l:'AME — board/staff page',u:'https://amebc.ca/about/board-staff/'},{l:'PLUS — About Us',u:'https://publiclanduse.ca/about-us/'}]},
{id:'moyse', label:'Geoffrey Moyse, K.C.', cat:'individual',
 detail:`Public Land Use Society's Legal & Policy Committee chair. 31 years as a senior BC government lawyer advising successive provincial governments on Aboriginal law (BC Ministry of Attorney General); appointed King's Counsel 2013; now in private practice. Authored a Fraser Institute commentary specifically about the Tahltan-Skeena Eskay Creek deal, "Recent deal highlights B.C. government's costly 'pay to play' approach to land use," framing the DRIPA s.7 consent agreement as a "pay to play" dynamic. Also authored a July 2026 PLUS-hosted piece on a separate, non-Tahltan Haida land deal using similar critical framing — part of a consistent editorial pattern, not a one-off. No tie found to any mining company board or government role beyond his documented prior BC-government legal career.`,
 sources:[{l:'Fraser Institute commentary',u:'https://www.fraserinstitute.org/commentary/recent-deal-highlights-bc-governments-costly-pay-play-approach-land-use'},{l:'PLUS — About Us',u:'https://publiclanduse.ca/about-us/'}]},
{id:'mirko', label:'Warren Mirko', cat:'individual',
 detail:`Public Land Use Society's Executive Director & Founder. 15+ years in public relations, crisis response, and risk management, including work supporting "public protection mandates" at BC Financial Services Authority, Engineers and Geoscientists BC, Technical Safety BC, and Transport Canada. Authored PLUS's own May 19, 2026 FOI press release on the Foundation Agreement using characterization language beyond neutral reporting ("many people will reasonably view that as the gradual splitting of British Columbia"). Also authored a Nov 29, 2025 opinion piece, "Eby government gives Tahltan Nation veto over gold mine development," using "vote buying" framing about a reported $10,000-per-eligible-voter payment ahead of a community ratification vote. His own LinkedIn describes PLUS's work as "collaborating with" AME. This framing context affects how to weigh PLUS's emphasis and editorializing — it does NOT mean the underlying FOI documents PLUS obtained are inaccurate.`,
 sources:[{l:'Northern Beat — Mirko opinion piece, Nov 29 2025',u:'https://northernbeat.ca/opinion/eby-government-gives-tahltan-nation-veto-over-gold-mine-development/'},{l:'PLUS — FOI press release, May 19 2026',u:'https://publiclanduse.ca/news/plus-foi-records-reveal-bc-negotiating-tahltan-title-land-transfers-and-governance-framework-across-11-of-province/'},{l:'LinkedIn — Warren Mirko',u:'https://ca.linkedin.com/in/warren-mirko-554024b'}]},
{id:'skuce', label:'Nikki Skuce', cat:'individual',
 detail:`Director of the Northern Confluence Initiative (a project on MakeWay's shared platform). Co-Chairs the BC Mining Law Reform network (BCMLR, founded 2019) alongside Jamie Kneen of MiningWatch Canada — described in this investigation's underlying research as "the single most significant documented cross-organization connection found." Former campaigner at ForestEthics (now Stand.earth), working on the Enbridge Northern Gateway opposition and the "Sacred Headwaters" (Mount Klappan) protection campaign. Prior work with One Sky on international environmental-justice programs. Volunteer board member: Langara College, Wet'zin'kwa Community Forest, Bulkley Valley Community Arts Council. Also listed as a team member/associate of West Coast Environmental Law's Environmental Law Centre.`,
 sources:[{l:'BCMLR — podcast episode with Skuce & Kneen',u:'https://reformbcmining.ca/news/2024/04/podcast-episode-1-the-bc-mining-law-reform-network-w-nikki-skuce-jamie-kneen/'},{l:'Northern Confluence — our mission',u:'https://northernconfluence.ca/about-us/our-mission/'}]},
{id:'kneen', label:'Jamie Kneen', cat:'individual',
 detail:`MiningWatch Canada's Outreach Coordinator and Canada Program Co-Lead (western/northern Canada policy and outreach; McGill biology background). Personally posted/hosted the Feb 25, 2005 Tahltan Elders moratorium statement ("Dena nenn Sogga neh 'ine") on MiningWatch's site, and covered the Sept 9, 2006 Iskut blockade (Lillian Moyer's arrest) as contemporaneous news — meaning MiningWatch's documented Tahltan-territory involvement predates the 2010 SCC MiningWatch v. Canada case already in this file by five years. Co-Chairs the BC Mining Law Reform network (BCMLR, founded 2019) with Nikki Skuce of Northern Confluence Initiative.`,
 sources:[{l:'MiningWatch — 2005 Tahltan Elders statement',u:'https://miningwatch.ca/blog/2005/2/25/tahltan-elders-statement-dena-nenn-sogga-neh-ine-protectors-and-keepers-land'},{l:'MiningWatch — 2006 Iskut blockade coverage',u:'https://miningwatch.ca/news/2006/9/11/grandmother-arrested-iskut-blockade'}]},

// -------- NGO / advocacy --------
{id:'ame', label:'Association for Mineral Exploration BC (AME)', cat:'ngo',
 detail:`Mining-industry association. The clearest documented industry-advocacy presence specific to Tahltan territory in this research: registered BC lobbying activity in 2015-16 naming Tahltan/BC discussions directly (see the Bennett connection). Registrant/designated filer Gavin Dirom; in-house lobbyists Rick Conte, Gavin Dirom, Glen Wonders. Traces an institutional lineage to 1912 (Vancouver Mining Club → BC Chamber of Mines → AME, renamed Dec 2000). Board seats confirmed for executives of three of the six companies mapped in this file: Maggie Layman (Manager of Exploration, Teck Resources, Executive Committee), Eric Casey (VP, Skeena Gold & Silver, Treasurer/Executive Committee), Keivan Hirji (Director External Relations, Newmont) — normal trade-association structure, not a conflict. President & CEO since Aug 5, 2025: Todd Stone, a former BC Minister of Transportation and Infrastructure (2013–2017, NOT Energy/Mines) — a former-cabinet-minister-to-industry-CEO pathway structurally similar to, but weaker than, Bill Bennett's documented revolving door.`,
 sources:[{l:'BC Lobbyist Registry — reg #507066',u:'https://www.lobbyistsregistrar.bc.ca/app/secure/orl/lrs/do/vwRg?cno=194&regId=507066'},{l:'BC Lobbyist Registry — reg #554318',u:'https://www.lobbyistsregistrar.bc.ca/app/secure/orl/lrs/do/vwRg?cno=194&regId=554318'},{l:'AME — board/staff page',u:'https://amebc.ca/about/board-staff/'},{l:'AME — Stone appointment release',u:'https://amebc.ca/news/association-for-mineral-exploration-welcomes-todd-stone-as-new-president-ceo/'}]},
{id:'skeenawild', label:'SkeenaWild Conservation Trust', cat:'ngo',
 detail:`Mining-impacts-focused conservation NGO, founded 2007 in Terrace, BC. CRA charitable BN 832887814RR0001. Published "Key Risks & Lessons at the Red Chris Mine" (~Mar 17, 2025), raising tailings/operational concerns. TCG published a public open-letter response (Apr 4, 2025) on its own website emphasizing its governance/co-management role and ongoing remediation work without directly rebutting SkeenaWild's technical claims — evidence the two positions differ, not evidence of an adversarial relationship. SkeenaWild also sat on the Community Advisory Committee for the Eskay Creek EA, and separately — with the Southeast Alaska Indigenous Transboundary Commission and supported by Ecojustice — filed its own legal challenge against the KSM "Substantially Started" designation (see the skeenawild↔seabridge edge; distinct from the TSKLH case elsewhere in this file). Clearest cumulative funder: the Gordon and Betty Moore Foundation, $2,272,654 across 3 grants since 2010 (VERIFIED, funder's own disclosure). FUNDING COMPOSITION (VERIFIED, Aug 12 2026 follow-up pass — CRA's own bulk open-data CSVs, BN 832887814RR0001 matched by legal name and Terrace BC address; open.canada.ca dataset 80c00cdb-1358-415c-bb8b-0de7f12675b8, not a third-party aggregator): FY2024 total revenue $1,893,814, of which ~86% ($1,628,061) came from the federal government; provincial government ($175,215), municipal government ($16,229), and tax-receipted private donations ($21,271) were all minor by comparison. SkeenaWild's funding is overwhelmingly government-sourced, not funded by the mining industry it monitors — no line item in the filing identifies any mining-company funding. This FY2024 figure and the Moore Foundation's cumulative-since-2010 figure are both true simultaneously (one fiscal year vs. multiple years). Board of 7 trustees; no documented mining/government tie found for any trustee (explicit negative finding; 3 of 7 bios not fully researched). Named/itemized private funders beyond the government and tax-receipted-donation totals above were not retrieved — would require CRA's "Non-Qualified Donees" resource or a Schedule 6 continuity schedule, not examined in this pass.`,
 sources:[{l:'TCG — open letter response',u:'https://tahltan.org/open-letter-response-to-skeenawilds-red-chris-report/'},{l:'SkeenaWild — Our Story',u:'https://skeenawild.org/our-story/'},{l:'Moore Foundation — SkeenaWild grantee detail',u:'https://www.moore.org/grantee-detail?granteeId=1322'},{l:'SkeenaWild — 2024 Annual Report (PDF)',u:'https://skeenawild.org/wp-content/uploads/2025/01/2024-SkeenaWild-Conservation-Trust-Annual-Report_Website.pdf'},{l:'CRA — 2024 List of Charities open-data dataset',u:'https://open.canada.ca/data/en/dataset/80c00cdb-1358-415c-bb8b-0de7f12675b8'}]},
{id:'klabona', label:'Klabona Keepers', cat:'ngo',
 detail:`Grassroots movement of Tahltan Elders and community members, distinct from and operating alongside — not identical to — the elected TCG. Formed 2005-2006 as a blockade movement (first blockade against Fortune Minerals 2005; became known as "Klabona Keepers" after blockading Shell's coalbed-methane operations 2006) — no evidence of formal incorporation was found; described everywhere as an informal grassroots collective, not a registered legal entity. Documented campaigns: blockades/resistance contributing to Shell Canada abandoning a coalbed-methane project (2004, ≈4,000 km² of Tahltan land; formally dropped 2012), the defeat of Fortune Minerals' proposed Mount Klappan open-pit coal mine after ≈15 years of opposition, and an Aug 8, 2014 blockade of Imperial Metals' Red Chris Mine itself (see the klabona↔imperial edge). Fiscal sponsorship for donations (tied to "The Klabona Keepers" documentary and youth land-based education program) runs through MakeWay and the Skeena Watershed Conservation Coalition (SWCC). No documented rupture with TCG was found — coverage shows parallel, sometimes overlapping activity, not conflict. As of a Sept 2022 article (the most recent substantive coverage located — flagged as a reporting gap, not confirmed inactivity), monitoring Newmont's mineral-claim purchases near Iskut village.`,
 sources:[{l:'The Narwhal — Klabona Keepers',u:'https://thenarwhal.ca/klabona-keepers-tahltan-nation/'},{l:'Rivers Without Borders — Iskut-Stikine',u:'https://www.riverswithoutborders.org/iskut-stikine'},{l:'IC Magazine — 2014 Red Chris blockade',u:'https://icmagazine.org/tahltan-elders-blockade-red-chris-mine-mount-polley-breach-25256/'},{l:'Beyond Boarding Collective — Klabona Keepers fiscal sponsorship',u:'http://beyondboardingcollective.com/donatekk'}]},
{id:'plus', label:'Public Land Use Society (PLUS)', cat:'ngo',
 detail:`BC advocacy group focused on Crown-land transparency, led by Executive Director & Founder Warren Mirko. Obtained BC government records on the Tahltan Foundation Agreement via a Freedom of Information request; published "FOI Records Obtained by PLUS Show Tahltan-BC Title Talks Cover 11% of Province" (May 19, 2026) — the primary source establishing that the Foundation Agreement is real, in-negotiation, and unsigned, with 400+ pages of related records withheld from disclosure. This is the single most load-bearing source in this investigation for correcting the viral "$1.28T land transfer" claim. FUNDING OPACITY FINDING: no funder or donor disclosure was found anywhere on publiclanduse.ca despite PLUS's central advocacy focus being government transparency, and PLUS's CRA charitable status could not be confirmed either way — a notable contrast given the org's own mission. IDEOLOGICAL-POSITIONING FINDING: PLUS's own leadership (Mirko; Legal & Policy Committee chair Geoffrey Moyse, K.C.) has personally authored, and its platform has republished, content using repeated "pay-to-play"/"rent-seeking"/"vote buying" framing about the Tahltan agreements specifically, called for DRIPA's repeal (Dec 16, 2025 press release), and allied on other campaigns with the Four Wheel Drive Association of BC and ATVBC. This affects how to weigh PLUS's framing and emphasis — it does NOT mean the underlying FOI documents PLUS obtained are inaccurate; the existence and contents of the withheld records are independently verifiable facts separate from PLUS's editorializing about them. A director, Jonas Rigaux, sits simultaneously on AME's board (see the rigaux↔plus/rigaux↔ame edges) — the clearest documented AME↔PLUS personnel overlap found.`,
 sources:[{l:'PLUS — FOI report, May 19 2026',u:'https://publiclanduse.ca/news/plus-foi-records-reveal-bc-negotiating-tahltan-title-land-transfers-and-governance-framework-across-11-of-province/'},{l:'PLUS — About Us',u:'https://publiclanduse.ca/about-us/'},{l:'PLUS — DRIPA repeal press release, Dec 16 2025',u:'https://publiclanduse.ca/news/'}]},
{id:'bcconservative', label:'BC Conservative Party', cat:'ngo',
 detail:`Provincial political party. Published "Massive NDP Land Transfers Could Total Up to 24 Million Acres" on conservativebc.ca, Aug 11, 2026 — the most direct match to the viral claim's phrasing, stating the NDP "plans to hand over up to 96,000 square kilometres... and $1.28 trillion in mineral wealth—to the Tahltan Nation." This is partisan advocacy framing ("hand over," implying a completed transaction) of a negotiation that PLUS's FOI reporting shows is still unsigned and in progress. The post also covers other Nations (Kitsumkalum, Kitselas, Wuikinuxv, In-SHUCK-ch, Te'mexw) alongside Tahltan.`,
 sources:[{l:'conservativebc.ca — Aug 11, 2026 post',u:'https://conservativebc.ca/massive-ndp-land-transfers-could-total-up-to-24-million-acres/'}]},
{id:'miningwatch', label:'MiningWatch Canada', cat:'ngo',
 detail:`National mining-accountability NGO, launched Apr 1, 1999 as a pan-Canadian coalition initiative (founder: Joan Kuyek). Brought MiningWatch Canada v. Canada (Fisheries and Oceans), 2010 SCC 2 — successfully argued federal authorities scoped the Red Chris environmental assessment too narrowly, but the Supreme Court (Rothstein J., unanimous, Jan 21, 2010) declined to order relief halting the mine — a declaratory win with no practical remedy. Its Tahltan-territory involvement actually predates that case by five years: its site hosted the Feb 25, 2005 Tahltan Elders moratorium statement and covered the Sept 2006 Iskut blockade (see the miningwatch↔klabona edge). Deliberately NOT a CRA-registered charity (to preserve advocacy latitude); uses a sister registered charity, the Canary Research Institute for Mining, Environment, and Health (incorporated Nov 3, 2003, CRA BN 871039400RR0001), to issue tax receipts. Operates as a coalition of 22 member organizations, including Rivers Without Borders (see the miningwatch↔riverswithoutborders edge). 2022 financials: total revenue $1,206,807; donors included the 11th Hour Project/Schmidt Family Foundation, Ford Foundation, Inter Pares, New Venture Fund, and the United Church of Canada.`,
 sources:[{l:'CanLII — 2010 SCC 2',u:'https://www.canlii.org/en/ca/scc/doc/2010/2010scc2/2010scc2.html'},{l:'MiningWatch — 25 years building mining justice',u:'https://www.miningwatch.ca/blog/2024/4/24/25-years-building-mining-justice'},{l:'CanadaHelps — Canary Research Institute',u:'https://www.canadahelps.org/en/charities/canary-research-institute-for-mining-environment-and-health/'},{l:'MiningWatch — Members page',u:'https://www.miningwatch.ca/miningwatch-canada-members'}]},
{id:'mabc', label:'Mining Association of BC (MABC)', cat:'ngo',
 detail:`Central BC mining-industry trade association. Founded 1901 per its own LinkedIn company page (REPORTED, not independently cross-checked against a history page — mining.bc.ca does not appear to carry one). HEADLINE FINDING of this investigation's NGO-network research pass: MABC's 48-seat board includes a named seat for every one of the six mining companies already in this file — Newmont, Imperial Metals (two seats), Teck Resources (two seats), Seabridge Gold, Skeena Resources, and Copper Fox Metals — PLUS a seat for Kutcho Copper Corp. held by Bill Bennett, the former BC Minister of Energy and Mines already flagged as this investigation's documented revolving-door finding. This extends that finding from a single company board onto the province's central mining trade-association board. Member-dues funded; specific dues schedule not published. BC Lobbyist Registry registration #1446-2123 (Michael Goehring, President/CEO; active since 2010-05-31; 413 total activity reports) — no Tahltan/Red Chris/Golden Triangle-specific mention found in the registration summary or most recent 12-month activity summary reviewed, though not all 413 reports were read individually.`,
 sources:[{l:'MABC — About (board list)',u:'https://mining.bc.ca/about'},{l:'MABC — Reconciliation page',u:'https://mining.bc.ca/reconciliation/'},{l:'BC Lobbyist Registry — MABC reg #1446-2123',u:'https://www.lobbyistsregistrar.bc.ca/app/secure/orl/lrs/do/vwRg?cno=2123&regId=56561664'}]},
{id:'dsf', label:'David Suzuki Foundation (DSF)', cat:'ngo',
 detail:`National environmental NGO. CRA charitable registration #12775 6716 RR0001. F2024 revenue ≈$14.761M per Charity Intelligence's T3010-derived breakdown (Canadian donations 82%; government funding negligible at $1K) — a conflicting $24.2M figure exists in a less-sourced aggregator; flagged as an unresolved discrepancy, CRA T3010 should be pulled directly to confirm. Current board (8 members) has NO documented mining, oil & gas, or government-official background — an explicit negative finding. Closest notable member: Stephen Bronfman (Executive Chairman, Claridge Inc., a private investment firm; no extractive-sector holding found in its disclosed portfolio) — also former Chief Revenue Officer of the Liberal Party of Canada and a senior advisor to PM Justin Trudeau, a finance/federal-politics tie, not a resource-industry one. Tahltan-specific activity: a Dec 8, 2022 story, "Tahltan's decades-long struggle to protect Sacred Headwaters," built substantially around promoting "The Klabona Keepers" documentary (co-directed by David Suzuki's grandson Tamo Campos) — editorial/campaign coverage, with no confirmed funding grant to any Tahltan-area group located.`,
 sources:[{l:'Charity Intelligence — DSF profile',u:'https://www.charityintelligence.ca/charity-details/247-david-suzuki-foundation'},{l:'DSF — Our Board',u:'https://davidsuzuki.org/about/staff-board/our-board/'},{l:'DSF — Sacred Headwaters story',u:'https://davidsuzuki.org/story/tahltans-decades-long-struggle-to-protect-sacred-headwaters/'}]},
{id:'northernconfluence', label:'Northern Confluence Initiative', cat:'ngo',
 detail:`A project on MakeWay's (formerly Tides Canada, renamed 2020) shared platform — NOT independently incorporated; MakeWay holds full fiduciary and governance responsibility. Based in Smithers, BC, focused on land-use decisions in northern BC salmon watersheds including mining development. Director: Nikki Skuce, who co-chairs the BC Mining Law Reform network (BCMLR, founded 2019) with Jamie Kneen of MiningWatch Canada. Northern Confluence's own "Partners" page lists SkeenaWild, Salmon Beyond Borders, and MiningWatch Canada together (alongside BCMLR and others) — a direct, documented, primary-source organizational link between three organizations in this investigation. No funding sources, budget, or financial figures specific to Northern Confluence were disclosed on its own site.`,
 sources:[{l:'Northern Confluence — our mission',u:'https://northernconfluence.ca/about-us/our-mission/'},{l:'Northern Confluence — partners page',u:'https://northernconfluence.ca/about-us/partners/'},{l:'MakeWay — Northern Confluence project listing',u:'https://makeway.org/project/northern-confluence/'}]},
{id:'riverswithoutborders', label:'Rivers Without Borders', cat:'ngo',
 detail:`Grew out of 1990s transboundary conservation advocacy in the Alsek-Tatshenshini watershed; formally organized in 1999 as the Transboundary Watershed Alliance (22 founding member groups), renamed Rivers Without Borders in 2007. Fiscally sponsored by Tides Center (a US 501(c)(3)), based in Port Townsend, WA — because it is fiscally sponsored rather than independently incorporated, it does NOT file its own IRS Form 990, so grant-level funding detail is not retrievable via the standard ProPublica Nonprofit Explorer lookup. Executive Director: Will Patric, since 2008. CONFIRMED as a formal dues-paying MEMBER of MiningWatch Canada's 22-organization coalition — the clearest institutional cross-connection found across this investigation's NGO network research. No specific named foundation funder was confirmed in research; funding sources remain a research gap.`,
 sources:[{l:'Rivers Without Borders — About',u:'https://www.riverswithoutborders.org/about-rivers-without-borders'},{l:'Rivers Without Borders — Our Team',u:'https://www.riverswithoutborders.org/our-team'},{l:'MiningWatch — Members page',u:'https://www.miningwatch.ca/miningwatch-canada-members'}]},
{id:'salmonbeyondborders', label:'Salmon Beyond Borders', cat:'ngo',
 detail:`A campaign of SalmonState (parent organization), which is itself fiscally sponsored by the New Venture Fund (a US 501(c)(3) vehicle managed by Arabella Advisors) — not independently incorporated; no separate EIN or Form 990. Founded ≈April 2014 by Jill Weitz "to address proposed mining development in northwestern British Columbia affecting transboundary rivers" (Weitz left for a Tlingit & Haida Tribes role ≈May 2022). Current campaign director: Breanna Walker. SalmonState's disclosed funders (2019–2023, per InfluenceWatch.org — a Capital Research Center-affiliated watchdog site with a critical "dark money" editorial orientation, flagged as a source-orientation caveat): William and Flora Hewlett Foundation (~$200K/yr), Wilburforce Foundation ($405K, 2023), Campion Foundation ($125K 2022/$350K 2019), Wild Salmon Center ($100K, 2023), Environmental Defense Fund ($20K, 2021). Notable adjacency: Wild Salmon Center is both a disclosed funder here and a listed conservation partner of SkeenaWild — a funding/convening-network proximity, not a governance overlap.`,
 sources:[{l:'InfluenceWatch — SalmonState profile',u:'https://www.influencewatch.org/organization/salmonstate/'},{l:'SalmonState — About',u:'https://salmonstate.org/about-salmonstate'},{l:'SalmonState — Jill Weitz bio',u:'https://salmonstate.org/salmon-stories/jill-weitz'}]},
{id:'kadesibe', label:"K'adesibe Collective", cat:'ngo',
 detail:`A group of Tahltan women whose members keep their identities confidential "due to fear of backlash within their community," per The Narwhal's Dec 3, 2025 reporting on the make-or-break Eskay Creek Impact Benefit Agreement vote. Sent a letter to Skeena Resources raising environmental concerns about the Eskay Creek project; per the article, the letter went unanswered. The same article notes general member complaints about feeling "muted or censored" in community meetings. REPORTED (The Narwhal), Dec 3 2025. DISTINCT FROM KLABONA KEEPERS: no source connects the two groups — this is documented as a separate, newer (2025) opposition voice specific to the Eskay Creek vote; do not imply continuity, overlap, or rebranding between them.`,
 sources:[{l:"The Narwhal — Eskay Creek mine faces make-or-break vote, Dec 3 2025",u:'https://thenarwhal.ca/eskay-creek-mine-skeena-resources-tahltan/'}]},
{id:'slater', label:'Beverly Slater', cat:'individual',
 detail:`Former interim President of the Tahltan Central Government. Quoted in The Narwhal's Dec 3, 2025 reporting on the Eskay Creek Impact Benefit Agreement vote, questioning whether the consent process constituted genuine "free, prior and informed consent." REPORTED (The Narwhal), Dec 3 2025. This is a named former TCG official's documented public concern, reported by a credible investigative outlet — it is not an allegation this investigation is making, and it does not mean the Eskay Creek vote (which passed per the official record — see the tcg↔skeena Impact Benefit Agreement edge) was invalid. Both facts are true simultaneously and are presented here without adjudication.`,
 sources:[{l:"The Narwhal — Eskay Creek mine faces make-or-break vote, Dec 3 2025",u:'https://thenarwhal.ca/eskay-creek-mine-skeena-resources-tahltan/'}]}
];

const EDGES = [
{id:'e1', s:'tcg', t:'gov-bc', type:'agreement', label:'Shared Prosperity Agreement',
 detail:`Signed Mar 30, 2020; publicly announced Jun 10, 2021 (a 15-month gap, flagged as notable by Northern Beat/PLUS since signing occurred days after COVID-19 emergency measures began, legislature not sitting). Parties: TCG, Tahltan Band Council, Iskut Band Council, Province of BC. Covers economic reconciliation funding, land-use planning framework, mineral permitting/placer-mining process changes, wildlife management, ongoing government-to-government partnership. NOT a land transfer. Provincial commitment: $16M economic self-determination + $4M implementation capacity = $20M total.`,
 sources:[{l:'BC Gov News — 2021EMLI0041',u:'https://news.gov.bc.ca/releases/2021EMLI0041-001128'}]},
{id:'e2', s:'tcg', t:'gov-bc', type:'agreement', label:'Consent-Based Decision Agreement (Red Chris)',
 detail:`Signed Nov 1, 2023 under s.7 of BC's Declaration on the Rights of Indigenous Peoples Act (DRIPA) — gives TCG consent authority over future Red Chris decisions, functioning as an effective project-specific veto. Signed by Ministers Murray Rankin and George Heyman, and TCG President Chad Norman Day.`,
 sources:[{l:'BC Gov News — 2023ENV0061',u:'https://news.gov.bc.ca/releases/2023ENV0061-001707'},{l:'CBC News',u:'https://www.cbc.ca/news/canada/british-columbia/bc-tahltan-nation-agreement-1.7015953'}]},
{id:'e3', s:'tcg', t:'gov-bc', type:'agreement-unsigned', label:'Foundation Agreement — UNSIGNED',
 detail:`NOT SIGNED. NOT PUBLICLY RELEASED. Per Public Land Use Society's May 19, 2026 FOI reporting, BC is negotiating a "Foundation Agreement" with TCG covering land transfers, governance restructuring, and recognition of Tahltan Aboriginal Title and Rights across the full 95,933 km² asserted territory (11% of BC). More than 400 pages of related government records were withheld from disclosure; PLUS did not obtain any draft text. Internal government target was Fall 2025 finalization — missed. As of Aug 12, 2026: in negotiation, unsigned, not public. THIS is the actual "land transfer" the viral $1.28T claim refers to — see the Risks tab "Correcting the viral claim" card.`,
 sources:[{l:'PLUS — FOI report, May 19 2026',u:'https://publiclanduse.ca/news/plus-foi-records-reveal-bc-negotiating-tahltan-title-land-transfers-and-governance-framework-across-11-of-province/'}]},
{id:'e4', s:'tcg', t:'newmont', type:'agreement', label:'Red Chris & Galore Creek engagement',
 detail:`Red Chris: operates under an impact-benefit and co-management agreement with the Tahltan Nation; the 2026 underground-expansion approval proceeded through the Nov 2023 consent-based process, with TCG formally consenting (dated ~May 22, per trade press). Galore Creek (Newmont 50% JV with Teck): original 2006 Participation Agreement plus a Nov 2023 BC-TCG decision-making/review agreement for collaborative assessment of proposed project changes.`,
 sources:[{l:'Canadian Mining Journal',u:'https://www.canadianminingjournal.com/news/newmonts-red-chris-underground-expansion-gets-regulatory-green-light-in-bc/'},{l:'GCMC project page',u:'https://www.gcmc.ca/galore-creek-project/'},{l:'ConstructConnect, Nov 2023',u:'https://canada.constructconnect.com/joc/news/government/2023/11/b-c-and-tahltan-nation-enter-agreement-on-galore-creek-review'}]},
{id:'e5', s:'tcg', t:'imperial', type:'agreement', label:'Red Chris benefit/co-management agreement',
 detail:`Imperial Metals (30% owner of Red Chris) operates under the same impact-benefit and co-management agreement with the Tahltan Nation described on the Newmont edge; TCG consented to the June 2026 underground expansion under the Nov 2023 s.7 consent framework.`,
 sources:[{l:'BC Gov News — 2026MCM0029',u:'https://news.gov.bc.ca/releases/2026MCM0029-000727'}]},
{id:'e6', s:'tcg', t:'teck', type:'agreement', label:'Galore Creek & Schaft Creek engagement',
 detail:`Galore Creek (Teck 50% JV with Newmont): 2006 Participation Agreement (technical/regulatory engagement, student bursaries, employment/business opportunities) plus a Nov 2023 BC-TCG review agreement. Schaft Creek (Teck 75% operator, Copper Fox 25%): Teck and the Tahltan Nation Development Corporation (TNDC) partnered on a solar-power facility at the project site (2025), plus educational/youth/cultural support. No dedicated Impact Benefit Agreement specific to Schaft Creek itself was found — the project remains at exploration/PEA stage.`,
 sources:[{l:'Teck — Galore Creek page',u:'https://www.teck.com/operations/canada/projects/galore-creek-project/'},{l:'Teck — Schaft Creek solar release',u:'https://www.teck.com/news/stories/2025/schaft-creek-solar-facility'}]},
{id:'e7', s:'tcg', t:'copperfox', type:'agreement', label:'Schaft Creek solar-facility partnership',
 detail:`Copper Fox holds 25% of the Schaft Creek JV (Teck 75%, operator). The 2025 solar-facility partnership at the Schaft Creek site is documented as a Teck–Tahltan Nation Development Corporation (TNDC) initiative; no separately-confirmed Copper Fox-specific IBA was located — flagged as a gap, included here since Copper Fox is a co-tenure holder of the same project site.`,
 sources:[{l:'Copper Fox — Schaft Creek overview',u:'https://copperfoxmetals.com/projects/schaft-creek-project/overview/'},{l:'Teck — Schaft Creek solar release',u:'https://www.teck.com/news/stories/2025/schaft-creek-solar-facility'}]},
{id:'e8', s:'tcg', t:'skeena', type:'agreement', label:'Eskay Creek Impact Benefit Agreement',

{id:'e9', s:'tcg', t:'seabridge', type:'agreement', label:'KSM Impact Benefits Agreement',

{id:'e31', s:'day', t:'tcg', type:'litigation', label:'Day v. Tahltan Central Government, 2025 BCSC 1363',

{id:'e46', s:'rigaux', t:'plus', type:'advisory', label:'Director, Public Land Use Society',

{id:'e59', s:'klabona', t:'imperial', type:'litigation', label:'Aug 8, 2014: Red Chris Mine blockade (NOT litigation — a direct-action protest)',
 detail:`Aug 8, 2014: Klabona Keepers blockaded Red Chris Mine (Imperial Metals-operated at the time, pre-Newmont acquisition), three days after Imperial Metals' Mount Polley tailings dam failure, demanding a safety review. This is NOT a court case — it is a direct-action protest, reusing the litigation edge style only for its purple/opposition visual grouping. Then-TCG President Chad Norman Day acknowledged the action while expressing general support for environmental protection; Imperial Metals president Brian Kynoch apologized publicly for Mount Polley the same week.`,
 sources:[{l:'IC Magazine — Tahltan Elders blockade Red Chris Mine',u:'https://icmagazine.org/tahltan-elders-blockade-red-chris-mine-mount-polley-breach-25256/'}]},
{id:'e60', s:'dsf', t:'klabona', type:'advisory', label:'Editorial coverage + family proximity, not a funding relationship',
 detail:`David Suzuki Foundation's Dec 8, 2022 story promotes "The Klabona Keepers" documentary, co-directed by David Suzuki's grandson Tamo Campos. No confirmed DSF grant to Klabona Keepers was located — this is editorial/campaign coverage and a family proximity, explicitly NOT a documented funding relationship.`,
 sources:[{l:'DSF — Sacred Headwaters story',u:'https://davidsuzuki.org/story/tahltans-decades-long-struggle-to-protect-sacred-headwaters/'}]},
{id:'e61', s:'skeenawild', t:'seabridge', type:'litigation', label:'Separate legal challenge to KSM "Substantially Started" designation',
 detail:`SkeenaWild itself — in partnership with the Southeast Alaska Indigenous Transboundary Commission (SEITC) and supported by Ecojustice — filed a SEPARATE legal challenge against the BC Environmental Assessment Office's decision that Seabridge Gold's KSM mine was "Substantially Started," letting the 10-year-old environmental assessment stand without a fresh review. THIS IS DISTINCT from the Tsetsaut Skii km Lax Ha Nation's judicial review of the same Substantial Start Determination already in this file (2026 BCSC 1042, Burke J.) — both target the same KSM SSD but have different plaintiffs; do not conflate the two cases.`,
 sources:[{l:'SkeenaWild — 2024 Annual Report (PDF)',u:'https://skeenawild.org/wp-content/uploads/2025/01/2024-SkeenaWild-Conservation-Trust-Annual-Report_Website.pdf'}]},
{id:'e62', s:'kadesibe', t:'skeena', type:'litigation', label:'Unanswered letter raising environmental concerns (Dec 2025)',
 detail:`Dec 2025: per The Narwhal's Dec 3, 2025 reporting, the K'adesibe Collective sent Skeena Resources a letter raising environmental concerns about the Eskay Creek project; the letter went unanswered. NOT LITIGATION — this is a direct advocacy action, reusing the litigation edge style only for its purple/opposition visual grouping, the same convention already used for the klabona↔imperial 2014 Red Chris blockade edge.`,

{id:'e63', s:'slater', t:'tcg', type:'advisory', label:'Former interim TCG President (past role); quoted consent-process concern',
 detail:`Beverly Slater is a former interim President of TCG — a past official role, reported here factually, using the same Advisory/legal edge style as this file's other past-role connections. In The Narwhal's Dec 3, 2025 reporting on the Eskay Creek vote, she is quoted questioning whether the consent process constituted genuine "free, prior and informed consent." A documented public concern raised by a named former official and reported by a credible outlet — not an allegation this investigation is making, and not evidence the vote (which passed per the official record) was invalid.`,

function el(tag, attrs){
  const e = document.createElementNS(NS, tag);
  for (const k in attrs) e.setAttribute(k, attrs[k]);

}

const edgeLayer = el('g',{id:'edgeLayer'});

// initialize node positions in a circle
const nodeById = {};
NODES.forEach((n,i)=>{
  const angle = (i / NODES.length) * Math.PI * 2;
  const r = Math.min(W,H) * 0.34;
  n.x = W/2 + Math.cos(angle) * r + (Math.random()-0.5)*20;
  n.y = H/2 + Math.sin(angle) * r + (Math.random()-0.5)*20;
  n.vx = 0; n.vy = 0;
  n.radius = (n.cat === 'individual' || n.cat === 'ngo') ? 8 : 11;
  n.fixed = false;
  nodeById[n.id] = n;
});

NODES.forEach(n=>{
  const g = el('g',{class:'node', 'data-id':n.id});
  const circle = el('circle',{class:'node-circle', r:n.radius, fill:CATS[n.cat].color});
  g.appendChild(circle);
  if (n.warning) {
    const ring = el('circle',{class:'node-warn-ring', r:n.radius+4});
    g.appendChild(ring);
    const wtxt = el('text',{class:'node-label warn-icon', x:n.radius+2, y:-n.radius-3});
    wtxt.textContent = '⚠';
    g.appendChild(wtxt);
  }
  const label = el('text',{class:'node-label', x:n.radius+4, y:4});
  label.textContent = n.label.length > 26 ? n.label.slice(0,24)+'…' : n.label;
  g.appendChild(label);
  svg_nodeInteractions(g, n);
  nodeLayer.appendChild(g);
  nodeEls.push({g, circle, n});
});

// build SVG edge elements

function firstLine(txt){
  const s = txt.trim().split('. ')[0];
  return s.length > 140 ? s.slice(0,140)+'…' : s + '.';
}

function svg_nodeInteractions(g, n){
  let dragging = false, offX=0, offY=0;
  g.addEventListener('mouseenter', (ev)=>{
    if (dragging) return;
    showTooltip(ev, `<div class="t-title">${n.label}${n.warning?' <span class="warn-icon">⚠</span>':''}</div><div class="t-cat">${CATS[n.cat].label}</div>${firstLine(n.detail)}`);
  });
  g.addEventListener('mousemove', moveTooltip);
  g.addEventListener('mouseleave', hideTooltip);
  g.addEventListener('mousedown', (ev)=>{
    dragging = true; n.fixed = true;
    hideTooltip();
    const pt = svgPoint(ev);
    offX = n.x - pt.x; offY = n.y - pt.y;
    ev.preventDefault();
  });
  window.addEventListener('mousemove', (ev)=>{
    if (!dragging) return;
    const pt = svgPoint(ev);
    n.x = pt.x + offX; n.y = pt.y + offY;
    n.vx = 0; n.vy = 0;
  });
  window.addEventListener('mouseup', ()=>{
    if (dragging) { dragging = false; n.fixed = false; }
  });
  g.addEventListener('click', (ev)=>{
    if (Math.abs(ev.movementX||0) + Math.abs(ev.movementY||0) < 2) openDetailNode(n);
  });
}

function svgPoint(ev){
  const rect = svg.getBoundingClientRect();
  return { x: ev.clientX - rect.left, y: ev.clientY - rect.top };
}

/* ============================== PHYSICS LOOP ============================== */

const REPULSION = 2600;
const SPRING_LEN = 130;
const SPRING_K = 0.02;
const DAMPING = 0.86;
const GRAVITY = 0.0009;

function tick(){
  W = graphPanel.clientWidth; H = graphPanel.clientHeight;
  const n = NODES;
  // repulsion
  for (let i=0;i<n.length;i++){
    for (let j=i+1;j<n.length;j++){
      let dx = n[i].x - n[j].x, dy = n[i].y - n[j].y;
      let d2 = dx*dx + dy*dy;
      if (d2 < 1) d2 = 1;
      const d = Math.sqrt(d2);
      const force = REPULSION / d2;
      const fx = (dx/d) * force, fy = (dy/d) * force;
      if (!n[i].fixed){ n[i].vx += fx; n[i].vy += fy; }
      if (!n[j].fixed){ n[j].vx -= fx; n[j].vy -= fy; }
    }
  }
  // springs
  EDGES.forEach(e=>{
    const a = nodeById[e.s], b = nodeById[e.t];
    let dx = b.x - a.x, dy = b.y - a.y;
    let d = Math.sqrt(dx*dx+dy*dy) || 1;
    const force = (d - SPRING_LEN) * SPRING_K;
    const fx = (dx/d) * force, fy = (dy/d) * force;
    if (!a.fixed){ a.vx += fx; a.vy += fy; }
    if (!b.fixed){ b.vx -= fx; b.vy -= fy; }
  });
  // gravity to center
  n.forEach(node=>{
    if (node.fixed) return;
    node.vx += (W/2 - node.x) * GRAVITY;
    node.vy += (H/2 - node.y) * GRAVITY;
    node.vx *= DAMPING; node.vy *= DAMPING;
    node.x += node.vx; node.y += node.vy;
    const pad = node.radius + 10;
    node.x = Math.max(pad, Math.min(W-pad, node.x));
    node.y = Math.max(pad, Math.min(H-pad, node.y));
  });
  render();
  requestAnimationFrame(tick);
}

function render(){
  svg.setAttribute('viewBox', `0 0 ${W} ${H}`);
  nodeEls.forEach(o=>{
    o.g.setAttribute('transform', `translate(${o.n.x},${o.n.y})`);
  });
  edgeEls.forEach(o=>{
    const a = nodeById[o.d.s], b = nodeById[o.d.t];
    o.line.setAttribute('x1',a.x); o.line.setAttribute('y1',a.y);
    o.line.setAttribute('x2',b.x); o.line.setAttribute('y2',b.y);
    o.hit.setAttribute('x1',a.x); o.hit.setAttribute('y1',a.y);
    o.hit.setAttribute('x2',b.x); o.hit.setAttribute('y2',b.y);
    if (o.warnEl){
      o.warnEl.setAttribute('x', (a.x+b.x)/2);
      o.warnEl.setAttribute('y', (a.y+b.y)/2);
    }
  });
}

    <p>AME's and MABC's boards combined hold named seats for all six mapped companies (Newmont, Imperial Metals, Teck, Seabridge Gold, Skeena Resources, Copper Fox Metals) plus Kutcho Copper. <strong>This is normal trade-association structure, explicitly NOT framed as a conflict</strong> — a mineral-sector lobby's board being composed of sector executives is exactly what it is for.</p>
    <div class="src"><a href="https://amebc.ca/about/board-staff/" target="_blank">AME — board/staff ↗</a><a href="https://mining.bc.ca/about" target="_blank">MABC — About ↗</a></div>
  </div>`;
  h += `<div class="card sev-advocacy">
    <h3>PLUS's leadership has personally authored advocacy content opposing the legal framework the Tahltan agreements were negotiated under</h3>
    <p>PLUS's Executive Director Warren Mirko ("vote buying," "the gradual splitting of British Columbia") and Legal &amp; Policy Committee chair Geoffrey Moyse, K.C. (a Fraser Institute "pay to play" commentary specifically about the Eskay Creek DRIPA agreement) have both authored content critical of the Tahltan agreements and DRIPA generally; PLUS itself called for DRIPA's repeal (Dec 16, 2025). <strong>This is context for weighing PLUS's framing and emphasis — it does NOT mean the underlying FOI documents PLUS obtained are inaccurate.</strong></p>
    <div class="src"><a href="https://www.fraserinstitute.org/commentary/recent-deal-highlights-bc-governments-costly-pay-play-approach-land-use" target="_blank">Fraser Institute ↗</a><a href="https://northernbeat.ca/opinion/eby-government-gives-tahltan-nation-veto-over-gold-mine-development/" target="_blank">Northern Beat op-ed ↗</a></div>
  </div>`;
  h += `<div class="card sev-advocacy">
    <h3>Environmental NGOs form a documented advocacy network — but show no financial ties to the mining side</h3>
    <p>Northern Confluence Initiative's own "Partners" page names SkeenaWild, Salmon Beyond Borders, and MiningWatch Canada together, alongside the BC Mining Law Reform network its director Nikki Skuce co-chairs with MiningWatch's Jamie Kneen. Rivers Without Borders is a formal dues-paying MiningWatch coalition member. <strong>Paired negative finding:</strong> no NGO board, staff, or funder overlap was found with any of the six mining companies or the named officials in this file.</p>
    <div class="src"><a href="https://northernconfluence.ca/about-us/partners/" target="_blank">Northern Confluence — Partners ↗</a><a href="https://www.miningwatch.ca/miningwatch-canada-members" target="_blank">MiningWatch — Members ↗</a></div>
  </div>`;
  h += `<div class="card sev-info">
    <h3>Grassroots opposition to Red Chris predates every government agreement in this file by years</h3>
    <p>Klabona Keepers blockaded Red Chris Mine itself on Aug 8, 2014 — a direct-action protest, not litigation — three days after Imperial Metals' Mount Polley tailings dam failure. MiningWatch Canada's documented Tahltan-territory involvement (hosting the 2005 Elders' moratorium statement, covering the 2006 Iskut blockade) predates even the 2010 SCC MiningWatch v. Canada case by five years.</p>
    <div class="src"><a href="https://icmagazine.org/tahltan-elders-blockade-red-chris-mine-mount-polley-breach-25256/" target="_blank">IC Magazine — 2014 blockade ↗</a><a href="https://miningwatch.ca/blog/2005/2/25/tahltan-elders-statement-dena-nenn-sogga-neh-ine-protectors-and-keepers-land" target="_blank">MiningWatch — 2005 statement ↗</a></div>
  </div>`;

  h += `<div class="section-label">4 · Foreign involvement</div>`;
  h += `<div class="card sev-info">
    <div class="sev-label">Negative finding — reported as such</div>
    <h3>Ordinary FDI only; no interference finding</h3>
    <p>Every major operator (Newmont [US-domiciled], Teck, Seabridge Gold, Skeena Gold &amp; Silver, Copper Fox Metals, Imperial Metals [all Canadian]) is a normal, legally-domiciled, publicly traded mining company. Newmont's US domicile, and predecessor Newcrest's former Australian domicile (until its Nov 2023 acquisition by Newmont), are ordinary foreign direct investment, fully disclosed in public filings.</p>
    <p><strong>No source was found alleging state-linked or government interference specific to Tahltan territory or any of the six named projects.</strong> This absence of evidence is reported as a negative finding, not as a suspicious gap requiring further scrutiny.</p>
  </div>`;

  h += `<div class="section-label">5 · Process / oversight</div>`;
  h += `<div class="card sev-warning">
    <h3>2016 Auditor General report, general litigation, and the Foundation Agreement transparency gap</h3>
    <p>BC's Auditor General found in May 2016 that mining-sector compliance and enforcement was inadequate <em>province-wide</em>, using Red Chris/Imperial Metals (opened months after the same company's Mount Polley tailings disaster, a different territory) as context — not a Tahltan-specific audit.</p>
    <p>Two rounds of litigation — Gitxaała v. BC (2023 BCSC 1680; 2025 BCCA 430) — struck down BC's "free entry" mineral-tenure system as inconsistent with the duty to consult and UNDRIP. Tsetsaut Skii km Lax Ha Nation v. BC (2026 BCSC 1042) found a separate duty-to-consult breach at KSM. <strong>None of these are Tahltan-party cases</strong> — they are general mineral-tenure-regime rulings that happen to affect all BC territory, Tahltan's included.</p>
    <p>The single largest remaining transparency/oversight gap: <strong>the unsigned, undisclosed Foundation Agreement itself</strong> — 400+ pages of related records withheld under FOI, no draft text obtained by anyone outside government and TCG negotiators.</p>
    <div class="src"><a href="https://www.oag.bc.ca/app/uploads/sites/963/2024/08/OAGBC-2016-05-01-OAGBC-Mining-Report-FINAL.pdf" target="_blank">2016 AG report (PDF) ↗</a></div>
  </div>`;

  c.innerHTML = h;
})();

(function buildSources(){
  const c = document.getElementById('tab-sources');

    h += `<div class="src-cat"><h4>${cat}</h4>`;

    });
    h += `</div>`;
  }
  h += `<div class="src-cat"><h4>Research Gaps</h4><ul class="gaps-list">`;
